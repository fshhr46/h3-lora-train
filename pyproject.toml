[project]
name = "h3-lora-train"
version = "0.1.0"
description = "Video Model LoRA Training Pipeline"
requires-python = ">=3.13"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "diffusers>=0.25.0",
    "transformers>=4.36.0",
    "peft>=0.7.0",
    "accelerate>=0.25.0",
    "xformers>=0.0.23",
    "opencv-python-headless>=4.8.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "yt-dlp>=2023.10.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
moviepy = ["moviepy>=1.0.3"]
wandb = ["wandb>=0.16.0"]

[tool.uv]
cache-dir = ".cache"
